<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 350px;
            padding: 15px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            margin: 0;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #333;
        }

        .header h2 {
            margin: 0 0 4px 0;
            color: #e0e0e0;
            font-size: 17px;
            font-weight: 600;
        }

        .header p {
            margin: 0;
            color: #8899aa;
            font-size: 11px;
        }

        .section {
            margin-bottom: 12px;
            padding: 12px;
            background: #16213e;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .section h3 {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #8899aa;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #8899aa;
            font-size: 11px;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            background: #0f0f23;
            color: #e0e0e0;
            transition: border-color 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-select {
            background: #00d4ff;
            color: #0f0f23;
            width: 100%;
            margin-bottom: 10px;
            font-weight: 700;
            border-radius: 6px;
        }

        .btn-select:hover {
            background: #00b8e6;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #218838;
        }

        .btn-pause {
            background: #ffc107;
            color: #1a1a2e;
        }

        .btn-pause:hover:not(:disabled) {
            background: #e0a800;
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #c82333;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .status {
            text-align: center;
            padding: 12px;
            background: #16213e;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid #333;
        }

        .current-value {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 4px;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .status-text {
            font-size: 11px;
            color: #8899aa;
        }

        .target-info {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .target-info.success {
            background: #1a3a1a;
            color: #28a745;
            border: 1px solid #28a74533;
        }

        .target-info.error {
            background: #3a1a1a;
            color: #dc3545;
            border: 1px solid #dc354533;
        }

        .target-info.info {
            background: #0a3a4a;
            color: #00d4ff;
            border: 1px solid #00d4ff33;
        }

        .selecting {
            background: #3a3a1a !important;
            color: #ffc107 !important;
            border: 1px solid #ffc10733 !important;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            accent-color: #00d4ff;
        }

        .checkbox-group label {
            margin: 0;
            font-size: 12px;
            color: #e0e0e0;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: #333;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #00d4ff;
            width: 0%;
            transition: width 0.1s ease;
        }

        .running .current-value {
            color: #28a745;
        }

        .instructions {
            font-size: 10px;
            color: #8899aa;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: #16213e;
            border-radius: 6px;
            border: 1px solid #333;
            line-height: 1.5;
        }

        .instructions strong {
            color: #e0e0e0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Auto-Increment</h2>
        <p>Automatically input incrementing values</p>
    </div>

    <button id="selectTarget" class="btn-select">Select Input Field</button>

    <div id="targetInfo" class="target-info hidden"></div>

    <div class="section">
        <h3>Settings</h3>

        <div class="control-group">
            <label for="startValue">Start Value:</label>
            <input type="number" id="startValue" value="1" step="1">
        </div>

        <div class="control-group">
            <label for="increment">Increment By:</label>
            <input type="number" id="increment" value="1" step="1">
        </div>

        <div class="control-group">
            <label for="interval">Interval (seconds):</label>
            <input type="number" id="interval" value="1" step="0.1" min="0.1">
        </div>

        <div class="control-group">
            <div class="checkbox-group">
                <input type="checkbox" id="autoSubmit" checked>
                <label for="autoSubmit">Press Enter after input</label>
            </div>
        </div>
    </div>

    <div class="status" id="statusDisplay">
        <div class="current-value" id="currentValue">1</div>
        <div class="status-text" id="statusText">Ready to start</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="button-group">
        <button id="startBtn" class="btn-start">Start</button>
        <button id="pauseBtn" class="btn-pause" disabled>Pause</button>
        <button id="stopBtn" class="btn-stop" disabled>Stop</button>
    </div>

    <div class="instructions">
        <strong>How to use:</strong><br>
        1. Click "Select Input Field"<br>
        2. Click on any input field on the page<br>
        3. Configure settings and click "Start"<br>
        <strong>Tip:</strong> Use arrow keys to manually step values
    </div>

    <script src="popup.js"></script>
</body>
</html>
